<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на общежитие</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>заявка на общежитие</h1>

    <form id="dormitoryForm">

        <label for="studentId">ID студента</label>
        <input
            type="number"
            id="studentId"
            placeholder="например: 1"
            required
        >

        <label for="buildingId">номер корпуса</label>
        <input
            type="number"
            id="buildingId"
            placeholder="например: 1"
            required
        >

        <label for="roomId">номер комнаты</label>
        <input
            type="number"
            id="roomId"
            placeholder="например: 101"
            required
        >

        <button type="submit">
            проверить заявку
        </button>

    </form>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
